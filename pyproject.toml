[project]
name = "story-pipeline"
version = "0.1.0"
description = "Git-backed CLI for collaborative long-form story production with LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
keywords = ["cli", "creative-writing", "llm", "storytelling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]

[project.scripts]
story-pipeline = "story_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["story_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
    "/docs",
    "/story_pipeline",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]
